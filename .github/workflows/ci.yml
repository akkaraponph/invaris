name: CI

# Check source on Linux before and after merging to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  GOSUMDB: 'off'

jobs:
  test:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test ./...
      - run: go test -race ./...
      - name: Offline smoke examples
        run: sh scripts/smoke.sh
      - name: JSON Schemas against real CLI output
        run: |
          python -m pip install -r scripts/requirements-schema.txt
          python scripts/validate-schemas.py
      - run: go test ./internal/mutation -run '^$' -fuzz '^FuzzPlan$' -fuzztime=10s

  dependency-cruiser:
    name: Dependency-Cruiser adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.2'
      - run: npm install --global npm@11.19.1
      - run: npm ci --prefix adapters/dependency-cruiser
      - run: node --test adapters/dependency-cruiser/provider.test.mjs
      - run: go test -tags=integration ./internal/engine -run '^TestDependencyCruiserProof$' -count=1 -v
