name: Release checks
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o "${RUNNER_TEMP}/invaris" ./cmd/invaris
      - run: go test ./internal/mutation -run '^$' -fuzz '^FuzzPlan$' -fuzztime=10s
      - name: Package release targets
        run: |
          python scripts/package-release.py v0.3.0 --output "${RUNNER_TEMP}/release"
          python scripts/verify-release.py v0.3.0 "${RUNNER_TEMP}/release"
      - run: sh scripts/smoke.sh
      - run: python -m pip install -r scripts/requirements-schema.txt
      - run: python scripts/validate-schemas.py
      - name: Upload checked release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 14

  dependency-cruiser:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.2'
      - run: npm install --global npm@11.19.1
      - run: npm ci --prefix adapters/dependency-cruiser
      - run: node --test adapters/dependency-cruiser/provider.test.mjs
      - run: go test -tags=integration ./internal/engine -run '^TestDependencyCruiserProof$' -count=1 -v
      - run: sh scripts/smoke.sh --with-dependency-cruiser
