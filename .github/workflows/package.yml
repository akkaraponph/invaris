name: Package

# Build the release archives once, then verify that exact set on each native
# platform available as a hosted runner. Called by ci.yml and release.yml.
on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the binaries, vMAJOR.MINOR.PATCH
        required: true
        type: string
      artifact-name:
        required: true
        type: string
      retention-days:
        required: false
        type: number
        default: 7

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  GOSUMDB: 'off'

jobs:
  build:
    name: Build archives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package-release.py "${{ inputs.version }}" --output "${RUNNER_TEMP}/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  verify:
    name: Verify (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # linux/amd64, linux/arm64 and darwin/arm64 run natively; darwin/amd64
        # is checked for checksum and contents only.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/dist
      - run: python scripts/verify-release.py "${{ inputs.version }}" "${RUNNER_TEMP}/dist"

  npm-build:
    name: Pack npm package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/dist
      - run: node --test npm/launcher.test.js
      - run: python scripts/package-npm.py "${{ inputs.version }}" "${RUNNER_TEMP}/dist" --output "${RUNNER_TEMP}/npm"
      - run: cd "${RUNNER_TEMP}/npm" && sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-npm
          path: ${{ runner.temp }}/npm/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  npm-verify:
    name: Verify npm (${{ matrix.os }})
    needs: npm-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-npm
          path: ${{ runner.temp }}/npm
      - name: Verify package and install
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd "${RUNNER_TEMP}/npm"
          shasum -a 256 -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          python scripts/verify-npm.py "$VERSION" "${RUNNER_TEMP}/dist" "${RUNNER_TEMP}/npm/invaris-${VERSION#v}.tgz"
