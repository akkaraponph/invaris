name: Release

# Pushing a tag vMAJOR.MINOR.PATCH that points at a commit on main runs the
# full CI, builds the archives once, verifies them natively and publishes a
# GitHub release with docs/releases/MAJOR.MINOR.PATCH.md as its notes.
# Package verification finishes before either publication; the two registries
# cannot be published atomically.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag is on main and has notes and a changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$TAG does not point at a commit on main"; exit 1; }
          test -s "docs/releases/$version.md" ||
            { echo "::error::missing docs/releases/$version.md"; exit 1; }
          grep -qx "## $version" CHANGELOG.md ||
            { echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; }

  ci:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml

  package:
    name: Package
    needs: ci
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ github.ref_name }}
      artifact-name: release-${{ github.ref_name }}
      retention-days: 30

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Invaris $TAG" \
            --notes-file "docs/releases/${TAG#v}.md"

  publish-npm:
    name: Publish npm package
    needs: [package, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.2'
      - run: npm install --global npm@11.19.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}-npm
          path: ${{ runner.temp }}/npm
      - name: Verify and publish tested package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd "${RUNNER_TEMP}/npm"
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          package="${RUNNER_TEMP}/npm/invaris-cli-${TAG#v}.tgz"
          python scripts/verify-npm.py "$TAG" "${RUNNER_TEMP}/dist" "$package"
          npm publish "$package" --access public --ignore-scripts
